[versions]
core = "1.19.1"
datastore = "1.3.0"
exifinterface = "1.4.2"
junit = "4.13.2"
lifecycle = "2.11.1"
smbj = "0.15.0"
agp = "9.5.2"
kotlin = "2.4.21"
compose = "1.13.0"
tv = "1.1.0"
activity = "1.13.0"
coroutines = "1.11.0"
media3 = "1.11.1"
[libraries]
core = { module = "androidx.core:core", version.ref = "core" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
smbj = { module = "com.hierynomus:smbj", version.ref = "smbj" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tv" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
[plugins]
android = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
