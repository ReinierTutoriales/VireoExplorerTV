name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
      - name: Install Android SDK platform
        run: |
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-37.2"
      - name: Verify required TV SDK images before compilation
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager_path"
          "$sdkmanager_path" --list --channel=0 > "$RUNNER_TEMP/vireo-sdk-packages.txt"
          python3 - "$RUNNER_TEMP/vireo-sdk-packages.txt" <<'PY'
          import sys
          from pathlib import Path
          packages = {line.split("|", 1)[0].strip()
                      for line in Path(sys.argv[1]).read_text().splitlines() if "|" in line}
          required = {
              "system-images;android-28;android-tv;x86",
              "system-images;android-30;android-tv;x86",
              "system-images;android-36;android-tv;x86_64",
          }
          missing = required - packages
          if missing:
              raise SystemExit("Unavailable stable SDK packages: " + ", ".join(sorted(missing)))
          print("Verified stable TV SDK packages: " + ", ".join(sorted(required)))
          PY
      - name: Check runtime test syntax
        run: python3 -m py_compile tests/tv_runtime.py
      - run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :tv-test:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: VireoExplorerTV-minified-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: VireoExplorerTV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: VireoExplorerTV-hierarchy-test
          path: tv-test/build/outputs/apk/debug/tv-test-debug.apk
          if-no-files-found: error

  tv-runtime:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            arch: x86
          - api: 30
            arch: x86
          - api: 36
            arch: x86_64
    env:
      VIREO_TEST_SMB_PASSWORD: VireoCIOnly42
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          name: VireoExplorerTV-minified-test
          path: artifacts/release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: VireoExplorerTV-debug
          path: artifacts/debug
      - uses: actions/download-artifact@v8.0.2
        with:
          name: VireoExplorerTV-hierarchy-test
          path: artifacts/hierarchy
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Start loopback SMB fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y samba
          sudo systemctl stop smbd || true
          mkdir -p /tmp/vireo-ci-smb
          printf 'Vireo SMB fixture\n' > /tmp/vireo-ci-smb/vireo-smb-fixture.txt
          python3 - <<'PY'
          import math, struct, wave
          rate = 16000
          with wave.open("/tmp/vireo-ci-smb/vireo-playback.wav", "wb") as audio:
              audio.setparams((1, 2, rate, 0, "NONE", "not compressed"))
              second = b"".join(struct.pack("<h", int(1000 * math.sin(2 * math.pi * 440 * i / rate))) for i in range(rate))
              for _ in range(40):
                  audio.writeframes(second)
          PY
          chmod 755 /tmp/vireo-ci-smb
          cat > /tmp/vireo-ci-smb.conf <<'CONFIG'
          [global]
          interfaces = 127.0.0.1
          bind interfaces only = yes
          smb ports = 445
          server min protocol = SMB2
          server signing = mandatory
          passdb backend = tdbsam:/tmp/vireo-ci-smb-passdb.tdb
          map to guest = Never
          [vireoci]
          path = /tmp/vireo-ci-smb
          guest ok = no
          read only = yes
          CONFIG
          printf '%s\n%s\n' "$VIREO_TEST_SMB_PASSWORD" "$VIREO_TEST_SMB_PASSWORD" |
            sudo smbpasswd -c /tmp/vireo-ci-smb.conf -s -a "$(id -un)"
          sudo smbd --daemon --configfile=/tmp/vireo-ci-smb.conf
      - name: Run Android TV storage and SMB checks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          emulator-boot-timeout: 240
          disable-animations: true
          script: python3 tests/tv_runtime.py --release artifacts/release/app-release.apk --debug artifacts/debug/app-debug.apk --hierarchy artifacts/hierarchy/tv-test-debug.apk --media-fixture /tmp/vireo-ci-smb/vireo-playback.wav --output runtime-evidence --smb-user "$(id -un)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: VireoExplorerTV-runtime-evidence-api-${{ matrix.api }}
          path: runtime-evidence
