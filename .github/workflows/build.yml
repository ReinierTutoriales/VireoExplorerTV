name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
      - run: sdkmanager "platforms;android-37"
      - run: gradle assembleDebug testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: VireoExplorerTV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
