name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
      - name: Install Android SDK platform
        run: |
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-36"
      - run: gradle assembleDebug testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: VireoExplorerTV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
